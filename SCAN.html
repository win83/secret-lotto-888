<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧鏡頭-自動清點</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #video-container { position: relative; width: 100vw; height: 100vh; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
        
        /* 狀態 HUD */
        .hud { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 10; width: 90%; text-align: center; pointer-events: none;
        }
        #status-bar {
            background: rgba(0,0,0,0.8); color: #00d1ff; padding: 15px;
            border-radius: 15px; border: 1px solid #00d1ff; font-size: 1.1rem;
        }
        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #121212; color: white; display: flex; 
            align-items: center; justify-content: center; z-index: 100;
        }
    </style>
</head>
<body>

<div id="loading" class="loading-screen">⚙️ 正在啟動智慧鏡頭引擎...</div>

<div id="video-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="hud">
        <div id="status-bar">🔍 正在掃描... 請對準出貨單與貼紙</div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusBar = document.getElementById('status-bar');
    const loading = document.getElementById('loading');

    let worker;
    let isProcessing = false;

    // 1. 啟動相機 (環境後鏡頭)
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", focusMode: "continuous" } 
            });
            video.srcObject = stream;
            return new Promise(res => video.onloadedmetadata = res);
        } catch (err) {
            alert("無法開啟相機，請確保使用 HTTPS 網址並允許權限");
        }
    }

    // 2. 初始化 OCR 引擎
    async function initAI() {
        worker = await Tesseract.createWorker('eng'); // 型號多為英數，用英文字庫速度最快
        loading.style.display = 'none';
        scanLoop();
    }

    // 3. 智慧鏡頭循環辨識
    async function scanLoop() {
        if (isProcessing) {
            requestAnimationFrame(scanLoop);
            return;
        }
        isProcessing = true;

        // 同步畫布與影片大小
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 擷取目前影格辨識
        const result = await worker.recognize(video);
        const words = result.data.words;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let detectedModels = [];
        words.forEach(word => {
            // 過濾：只要長度大於 6 且包含英數組合的字串
            let cleanText = word.text.trim().replace(/[^A-Z0-9-]/gi, '').toUpperCase();
            if (cleanText.length >= 7) {
                detectedModels.push({ text: cleanText, bbox: word.bbox });
            }
        });

        // 4. 比對邏輯：找出畫面中相同的字串
        const counts = {};
        const duplicates = [];

        detectedModels.forEach(item => {
            counts[item.text] = (counts[item.text] || 0) + 1;
            // 繪製藍色基礎框
            drawBox(item.bbox, "#00d1ff", item.text);
        });

        // 檢查是否有相同的文字
        let matchCount = 0;
        let lastMatchedText = "";

        for (const [text, count] of Object.entries(counts)) {
            if (count >= 2) {
                matchCount = count;
                lastMatchedText = text;
                // 將相同的文字標註為綠色框
                detectedModels.filter(m => m.text === text).forEach(m => {
                    drawBox(m.bbox, "#28a745", "MATCHED");
                });
            }
        }

        // 5. 更新 HUD 狀態
        if (matchCount >= 2) {
            statusBar.innerHTML = `✅ 偵測到相同型號: <b>${lastMatchedText}</b><br>數量: ${matchCount} 張貼紙`;
            statusBar.style.borderColor = "#28a745";
            statusBar.style.color = "#28a745";
            if (navigator.vibrate) navigator.vibrate(50); // 輕微震動回饋
        } else {
            statusBar.innerHTML = `🔍 正在搜尋對應文字... (已偵測 ${detectedModels.length} 組字串)`;
            statusBar.style.borderColor = "#00d1ff";
            statusBar.style.color = "#00d1ff";
        }

        isProcessing = false;
        // 稍微延遲避免手機過熱，每秒辨識約 2 次
        setTimeout(scanLoop, 500); 
    }

    function drawBox(bbox, color, label) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.strokeRect(bbox.x0, bbox.y0, bbox.x1 - bbox.x0, bbox.y1 - bbox.y0);
        ctx.fillStyle = color;
        ctx.font = "bold 20px Arial";
        ctx.fillText(label, bbox.x0, bbox.y0 - 10);
    }

    startCamera().then(initAI);
</script>
</body>
</html>
