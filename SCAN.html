<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>機碼文字比對系統</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #000; color: white; overflow: hidden; }
        .container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* 調整後的掃描框：更寬、更高，適合長字串 */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .scan-region {
            width: 90%;       /* 寬度增加到 90% */
            height: 480px;    /* 高度增加到 180px */
            border: 3px solid #00ff00;
            box-shadow: 0 0 0 5000px rgba(0, 0, 0, 0.6); /* 增加背景陰影深度 */
            border-radius: 12px;
            position: relative;
        }
        /* 框角裝飾 */
        .scan-region::after {
            content: "對準文字區域";
            position: absolute; top: -30px; left: 0; color: #00ff00; font-size: 14px;
        }
        
        .ui-panel {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            pointer-events: auto;
        }
        button {
            padding: 18px 50px; font-size: 20px; border-radius: 35px;
            border: none; background: #00ff00; color: black; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,255,0,0.3);
        }
        #result-status {
            position: absolute; top: 40px; width: 100%; text-align: center;
            font-size: 1.4em; padding: 15px; font-weight: bold;
        }
        #debug-text { font-size: 14px; color: #00ff00; margin-top: 15px; background: rgba(0,0,0,0.5); }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <video id="video" autoplay playsinline></video>
    
    <div class="overlay">
        <div class="scan-region"></div>
        <p style="margin-top: 20px; color: #ccc;">將「貼紙文字」或「單據型號」放入綠框</p>
    </div>

    <div id="result-status">準備就緒</div>

    <div class="ui-panel">
        <button id="snap">點擊辨識文字</button>
        <div id="debug-text">尚未偵測</div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('result-status');
    const debug = document.getElementById('debug-text');

    // 開啟相機
    navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "environment", focusMode: "continuous" } 
    }).then(stream => { video.srcObject = stream; });

    document.getElementById('snap').addEventListener('click', async () => {
        status.innerText = "🔍 辨識中...";
        status.style.color = "yellow";

        const ctx = canvas.getContext('2d');
        // 增加畫布解析度以提升 OCR 準確度
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        
        // 執行 OCR
        Tesseract.recognize(canvas.toDataURL('image/jpeg', 0.8), 'eng', {
            logger: m => console.log(m)
        }).then(({ data: { text } }) => {
            // 過濾掉雜質，只留大寫英文、數字、橫線
            const cleanText = text.replace(/[^A-Z0-9-]/g, ' ').trim();
            debug.innerText = "偵測結果: " + cleanText;

            checkMatch(cleanText);
        });
    });

    function checkMatch(detectedText) {
        // 這裡可以放入您這批貨預期要比對的型號
        const targetModel = "NA-V170NMS"; 
        
        if (detectedText.includes(targetModel)) {
            status.innerText = "✅ 比對成功 (型號正確)";
            status.style.color = "#00ff00";
        } else {
            status.innerText = "❓ 未能完全匹配";
            status.style.color = "#ff4444";
        }
    }
</script>
</body>
</html>
