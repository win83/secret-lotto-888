<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>電器出貨雙重對比助手</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; padding: 15px; text-align: center; }
        .camera-view { width: 100%; height: 300px; background: #000; border-radius: 15px; overflow: hidden; position: relative; border: 2px solid #333; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .slot-container { display: flex; justify-content: space-around; margin: 20px 0; }
        .slot { width: 45%; border: 2px dashed #666; border-radius: 10px; padding: 10px; min-height: 80px; background: #1e1e1e; }
        .slot.active { border-color: #00d1ff; background: #002b36; }
        .slot.filled { border-color: #28a745; border-style: solid; }
        .btn-capture { background: #1a73e8; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 1.2rem; margin: 10px; width: 80%; }
        .btn-reset { background: #444; color: #ccc; border: none; padding: 10px; border-radius: 5px; margin-top: 20px; }
        #result { margin-top: 20px; font-size: 1.5rem; font-weight: bold; padding: 15px; border-radius: 10px; display: none; }
        .match { background: #28a745; color: white; }
        .error { background: #dc3545; color: white; }
        .model-text { font-family: monospace; font-size: 1rem; color: #00d1ff; display: block; margin-top: 5px; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

    <div id="loading-overlay">⌛ AI 辨識中...</div>

    <h2>📦 拍照比對助手</h2>

    <div class="camera-view">
        <video id="video" autoplay playsinline></video>
    </div>

    <button class="btn-capture" onclick="capture()">📸 拍照辨識</button>

    <div class="slot-container">
        <div id="slot1" class="slot active">
            <div>1. 出貨單品名</div>
            <span id="text1" class="model-text">等待拍照...</span>
        </div>
        <div id="slot2" class="slot">
            <div>2. 機碼貼紙</div>
            <span id="text2" class="model-text">等待拍照...</span>
        </div>
    </div>

    <div id="result"></div>

    <button class="btn-reset" onclick="resetAll()">全部清除重拍</button>

    <script>
        const video = document.getElementById('video');
        const loading = document.getElementById('loading-overlay');
        const slot1 = document.getElementById('slot1');
        const slot2 = document.getElementById('slot2');
        const text1El = document.getElementById('text1');
        const text2El = document.getElementById('text2');
        const resultEl = document.getElementById('result');

        let worker;
        let model1 = "";
        let model2 = "";

        // 啟動相機
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; });

        // 初始化 AI
        async function initAI() {
            worker = await Tesseract.createWorker('eng');
        }
        initAI();

        async function capture() {
            loading.style.display = 'flex';
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            // 辨識文字
            const result = await worker.recognize(canvas);
            const foundModels = result.data.words
                .map(w => w.text.replace(/[^A-Z0-9-]/gi, '').toUpperCase())
                .filter(t => t.length >= 6);

            // 邏輯：如果單次拍照就抓到兩個型號，直接完成比對
            if (foundModels.length >= 2 && model1 === "") {
                model1 = foundModels[0];
                model2 = foundModels[1];
                updateUI(true);
            } 
            // 邏輯：如果是分開拍
            else if (foundModels.length >= 1) {
                if (model1 === "") {
                    model1 = foundModels[0];
                    updateUI(false);
                } else {
                    model2 = foundModels[0];
                    updateUI(false);
                }
            }

            loading.style.display = 'none';
            checkMatch();
        }

        function updateUI(isSimultaneous) {
            if (model1) {
                text1El.innerText = model1;
                slot1.classList.add('filled');
                slot1.classList.remove('active');
                slot2.classList.add('active');
            }
            if (model2) {
                text2El.innerText = model2;
                slot2.classList.add('filled');
                slot2.classList.remove('active');
            }
        }

        function checkMatch() {
            if (model1 && model2) {
                resultEl.style.display = 'block';
                // 模糊比對：內容包含或長度接近
                if (model1.includes(model2) || model2.includes(model1)) {
                    resultEl.innerText = "✅ 型號吻合！可以出貨";
                    resultEl.className = "result match";
                    if(navigator.vibrate) navigator.vibrate(200);
                } else {
                    resultEl.innerText = "❌ 錯誤！型號不符";
                    resultEl.className = "result error";
                    if(navigator.vibrate) navigator.vibrate([300, 100, 300]);
                }
            }
        }

        function resetAll() {
            model1 = "";
            model2 = "";
            text1El.innerText = "等待拍照...";
            text2El.innerText = "等待拍照...";
            slot1.className = "slot active";
            slot2.className = "slot";
            resultEl.style.display = 'none';
        }
    </script>
</body>
</html>
