<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>專業出貨掃描儀</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        /* 相機底層 */
        #camera-wrapper { position: relative; width: 100vw; height: 60vh; background: #222; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* 定位框遮罩 */
        .scanner-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.4);
            pointer-events: none;
        }
        .scan-window {
            width: 80%; height: 120px;
            border: 2px solid #00d1ff;
            box-shadow: 0 0 15px rgba(0, 209, 255, 0.5);
            background: rgba(0, 209, 255, 0.05);
            position: relative;
        }
        .scan-window::after {
            content: "將型號文字放入框內";
            position: absolute; bottom: -30px; left: 0; width: 100%;
            text-align: center; color: #00d1ff; font-size: 14px;
        }

        /* 下方操作區 */
        .control-panel { height: 40vh; background: #1a1a1a; padding: 15px; box-sizing: border-box; }
        .slots { display: flex; gap: 10px; margin-bottom: 15px; }
        .slot { flex: 1; padding: 10px; border: 1px solid #444; border-radius: 8px; font-size: 13px; text-align: left; }
        .slot.active { border-color: #00d1ff; background: #002b36; }
        .slot b { color: #888; display: block; margin-bottom: 5px; }
        .slot span { color: #fff; font-weight: bold; word-break: break-all; }

        .btn-scan {
            width: 100%; padding: 20px; font-size: 1.5rem; font-weight: bold;
            background: #1a73e8; color: white; border: none; border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-scan:active { background: #1557b0; transform: scale(0.98); }

        #result-popup {
            position: fixed; top: 20%; left: 5%; width: 90%; 
            padding: 30px 0; border-radius: 15px; text-align: center;
            font-size: 2.5rem; font-weight: bold; z-index: 100; display: none;
        }
    </style>
</head>
<body>

<div id="camera-wrapper">
    <video id="video" autoplay playsinline></video>
    <div class="scanner-overlay">
        <div class="scan-window" id="scan-window"></div>
    </div>
</div>

<div class="control-panel">
    <div class="slots">
        <div id="slot1" class="slot active"><b>📦 出貨單品名</b><span id="text1">等待掃描...</span></div>
        <div id="slot2" class="slot"><b>🏷️ 機碼貼紙</b><span id="text2">等待掃描...</span></div>
    </div>
    <button class="btn-scan" onclick="performScan()">按下掃描比對</button>
    <div style="text-align: center; margin-top: 15px;">
        <button onclick="location.reload()" style="background:none; border:none; color:#666; text-decoration:underline;">重設全部</button>
    </div>
</div>

<div id="result-popup"></div>

<script>
    const video = document.getElementById('video');
    const slot1 = document.getElementById('slot1');
    const slot2 = document.getElementById('slot2');
    const text1 = document.getElementById('text1');
    const text2 = document.getElementById('text2');
    const resultPopup = document.getElementById('result-popup');

    let worker;
    let code1 = "";
    let code2 = "";

    // 啟動相機
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => { video.srcObject = stream; });

    // 初始化 Tesseract
    async function init() {
        worker = await Tesseract.createWorker('eng');
    }
    init();

    async function performScan() {
        // UI 回饋
        statusUpdate("正在辨識...");
        
        // 擷取框框內的畫面
        const canvas = document.createElement('canvas');
        const scale = video.videoWidth / video.clientWidth;
        
        // 只截取中間定位框的位置
        const windowRect = document.getElementById('scan-window').getBoundingClientRect();
        const videoRect = video.getBoundingClientRect();

        canvas.width = windowRect.width * scale;
        canvas.height = windowRect.height * scale;
        
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 
            (windowRect.left - videoRect.left) * scale, (windowRect.top - videoRect.top) * scale, 
            windowRect.width * scale, windowRect.height * scale,
            0, 0, canvas.width, canvas.height
        );

        // 執行辨識
        const { data: { text } } = await worker.recognize(canvas);
        const cleanText = text.replace(/[^A-Z0-9-]/gi, '').toUpperCase();
        
        if (cleanText.length < 5) {
            statusUpdate("辨識失敗，請對準一點");
            return;
        }

        if (code1 === "") {
            code1 = cleanText;
            text1.innerText = code1;
            slot1.classList.remove('active');
            slot2.classList.add('active');
            statusUpdate("第一組OK，請掃描貼紙");
        } else {
            code2 = cleanText;
            text2.innerText = code2;
            compare();
        }
    }

    function statusUpdate(msg) {
        document.querySelector('.btn-scan').innerText = msg;
        setTimeout(() => {
            if (code2 === "") document.querySelector('.btn-scan').innerText = "按下掃描比對";
        }, 1500);
    }

    function compare() {
        resultPopup.style.display = 'block';
        if (code1.includes(code2) || code2.includes(code1)) {
            resultPopup.innerText = "✅ 正確";
            resultPopup.style.background = "#28a745";
            if(navigator.vibrate) navigator.vibrate(200);
        } else {
            resultPopup.innerText = "❌ 錯誤";
            resultPopup.style.background = "#dc3545";
            if(navigator.vibrate) navigator.vibrate([300, 100, 300]);
        }
        
        setTimeout(() => {
            resultPopup.style.display = 'none';
            location.reload(); // 比對完自動重設，方便掃下一張
        }, 3000);
    }
</script>
</body>
</html>
