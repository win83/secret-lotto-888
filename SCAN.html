<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出貨單機碼即時比對</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f4f4f9; }
        #video { width: 100%; max-width: 400px; border: 2px solid #333; border-radius: 10px; }
        #canvas { display: none; }
        .controls { margin-top: 15px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        #status { margin-top: 20px; font-weight: bold; font-size: 1.1em; }
        .match { color: #28a745; background: #e8f5e9; padding: 10px; border-radius: 5px; }
        .mismatch { color: #dc3545; background: #fdeaea; padding: 10px; border-radius: 5px; }
        .loading { color: #666; }
    </style>
</head>
<body>

    <h2>機碼/型號自動比對</h2>
    
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="controls">
        <button id="capture">擷取並比對文字</button>
    </div>

    <div id="status">請對準貼紙與單據文字後按下按鈕</div>
    
    <div id="results" style="margin-top: 20px; text-align: left; display: inline-block;">
        <p>辨識結果：<span id="detected-text">--</span></p>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const detectedTextElement = document.getElementById('detected-text');

        // 1. 啟動相機 (後置鏡頭)
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
            } catch (err) {
                status.innerText = "無法開啟相機，請確認是否允許權限或使用 HTTPS 連線。";
            }
        }

        // 2. 擷取畫面並辨識
        document.getElementById('capture').addEventListener('click', async () => {
            status.innerHTML = '<span class="loading">辨識中，請稍候...</span>';
            
            // 將影像畫到畫布上
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            // 使用 Tesseract.js 辨識英數字 (針對型號與機號)
            Tesseract.recognize(
                canvas.toDataURL('image/png'),
                'eng', // 辨識英文與數字
                { logger: m => console.log(m) }
            ).then(({ data: { text } }) => {
                processResult(text);
            });
        });

        // 3. 比對邏輯
        function processResult(rawText) {
            // 清理文字，只留大寫英文與數字
            const cleanText = rawText.replace(/[^A-Z0-9-]/g, '');
            detectedTextElement.innerText = cleanText;

            // 範例邏輯：檢查畫面中是否同時存在型號 "NA-V170NMS"
            // 在實際應用中，我們會檢查 cleanText 是否包含多組相同的字串
            const modelKey = "NAV170NMS"; 
            
            // 尋找字串中出現兩次以上（表示貼紙跟單據都有）
            const occurrences = (cleanText.match(new RegExp(modelKey, "g")) || []).length;

            if (occurrences >= 2) {
                status.innerHTML = `<div class="match">✅ 比對成功！<br>偵測到型號：${modelKey} 已重複出現在貼紙與單據上。</div>`;
            } else if (occurrences === 1) {
                status.innerHTML = `<div class="mismatch">⚠️ 僅偵測到一處型號，請確保貼紙與單據都在畫面內。</div>`;
            } else {
                status.innerHTML = `<div class="mismatch">❌ 比對失敗：未偵測到相符機型文字。</div>`;
            }
        }

        startCamera();
    </script>
</body>
</html>
