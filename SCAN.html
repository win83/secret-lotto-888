<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR 智慧掃描</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #video-container { position: relative; width: 100vw; height: 100vh; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
        
        .hud { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; width: 85%; text-align: center;
        }
        #status-bar {
            background: rgba(0,0,0,0.7); color: #00ff00; padding: 10px;
            border-radius: 10px; border: 1px solid #00ff00; font-weight: bold;
        }
        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #121212; color: white; display: flex; 
            align-items: center; justify-content: center; z-index: 100;
        }
    </style>
</head>
<body>

<div id="loading" class="loading-screen">⚙️ AI 智慧鏡頭啟動中...</div>

<div id="video-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="hud">
        <div id="status-bar">🔍 請對準品名與貼紙...</div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusBar = document.getElementById('status-bar');
    const loading = document.getElementById('loading');

    let worker;
    let isProcessing = false;

    // 啟動相機
    async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment", focusMode: "continuous" } 
        });
        video.srcObject = stream;
        return new Promise(res => video.onloadedmetadata = res);
    }

    // 初始化 AI
    async function initAI() {
        worker = await Tesseract.createWorker('eng');
        loading.style.display = 'none';
        scanLoop();
    }

    async function scanLoop() {
        if (isProcessing) { requestAnimationFrame(scanLoop); return; }
        isProcessing = true;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 抓取當前影格
        const result = await worker.recognize(video);
        const words = result.data.words;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let detectedItems = [];
        words.forEach(word => {
            // 過濾型號：長度 > 6 的英數組合
            let text = word.text.trim().replace(/[^A-Z0-9-]/gi, '').toUpperCase();
            if (text.length >= 7) {
                detectedItems.push({ text, bbox: word.bbox });
            }
        });

        // 比對：找出相同的文字
        const groups = {};
        detectedItems.forEach(item => {
            if (!groups[item.text]) groups[item.text] = [];
            groups[item.text].push(item);
        });

        let foundMatch = false;
        for (const text in groups) {
            if (groups[text].length >= 2) {
                foundMatch = true;
                const matches = groups[text];
                
                // 畫框與連線
                ctx.strokeStyle = "#00ff00";
                ctx.lineWidth = 5;
                ctx.beginPath();
                
                matches.forEach((m, index) => {
                    const b = m.bbox;
                    // 畫框
                    ctx.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
                    // 畫連線 (連到下一個相同的字)
                    if (index < matches.length - 1) {
                        ctx.moveTo(b.x0 + (b.x1-b.x0)/2, b.y0 + (b.y1-b.y0)/2);
                        const nextB = matches[index+1].bbox;
                        ctx.lineTo(nextB.x0 + (nextB.x1-nextB.x0)/2, nextB.y0 + (nextB.y1-nextB.y0)/2);
                    }
                });
                ctx.stroke();

                statusBar.innerText = `✅ 匹配成功: ${text} (共 ${matches.length} 處)`;
                if (navigator.vibrate) navigator.vibrate(50);
            }
        }

        if (!foundMatch) {
            statusBar.innerText = "🔍 搜尋重複文字中...";
            // 沒匹配到時顯示藍色偵測框
            detectedItems.forEach(item => {
                ctx.strokeStyle = "rgba(0, 209, 255, 0.4)";
                ctx.lineWidth = 2;
                ctx.strokeRect(item.bbox.x0, item.bbox.y0, item.bbox.x1 - item.bbox.x0, item.bbox.y1 - item.bbox.y0);
            });
        }

        isProcessing = false;
        setTimeout(scanLoop, 300); // 控制辨識頻率
    }

    startCamera().then(initAI);
</script>
</body>
</html>
