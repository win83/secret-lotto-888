<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出貨紅框自動比對</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .main-card { background: #1e1e1e; border-radius: 20px; padding: 30px; border: 2px solid #333; }
        .btn-scan { background: #00d1ff; color: #000; border: none; padding: 20px; border-radius: 50px; font-size: 1.5rem; font-weight: bold; width: 100%; margin: 20px 0; }
        #loading { display: none; font-size: 1.2rem; color: #fbff00; margin: 10px 0; }
        .result-area { display: none; margin-top: 20px; padding: 20px; border-radius: 15px; font-size: 1.8rem; font-weight: bold; }
        .pass { background: #28a745; border: 3px solid #fff; }
        .fail { background: #dc3545; border: 3px solid #fff; }
        .debug-text { font-size: 0.9rem; color: #888; margin-top: 15px; text-align: left; background: #000; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="main-card">
        <h2>📷 單張拍照自動比對</h2>
        <p>請對準出貨單<span style="color:red">紅框區域</span>拍照</p>

        <input type="file" accept="image/*" capture="environment" id="file-input" style="display:none">
        <button class="btn-scan" onclick="document.getElementById('file-input').click()">📸 拍一張照即比對</button>

        <div id="loading">⌛ AI 辨識中，請稍候...</div>

        <div id="result-box" class="result-area"></div>
        
        <div id="debug-info" class="debug-text" style="display:none">
            <b>偵測到的內容：</b><br>
            <span id="found-items"></span>
        </div>
    </div>

    <script>
        let worker;
        // 初始化 AI 引擎
        async function init() {
            worker = await Tesseract.createWorker('eng');
        }
        init();

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('result-box');
            const debugInfo = document.getElementById('debug-info');
            const foundItems = document.getElementById('found-items');

            loading.style.display = 'block';
            resultBox.style.display = 'none';

            // 辨識整張照片的文字
            const result = await worker.recognize(file);
            const words = result.data.words;

            // 過濾出長得像型號的字串 (英數組合，長度 6 以上)
            let models = words
                .map(w => w.text.trim().replace(/[^A-Z0-9-]/gi, '').toUpperCase())
                .filter(t => t.length >= 6);

            // 去除重複偵測到的相同字串
            models = [...new Set(models)];

            loading.style.display = 'none';
            debugInfo.style.display = 'block';
            foundItems.innerText = models.join(' , ');

            if (models.length >= 2) {
                // 拿前兩個抓到的型號進行比對
                const m1 = models[0];
                const m2 = models[1];

                resultBox.style.display = 'block';
                if (m1 === m2 || m1.includes(m2) || m2.includes(m1)) {
                    resultBox.innerText = "✅ 正確一致";
                    resultBox.className = "result-area pass";
                    if(navigator.vibrate) navigator.vibrate(200);
                } else {
                    resultBox.innerText = "❌ 型號不符";
                    resultBox.className = "result-area fail";
                    if(navigator.vibrate) navigator.vibrate([300, 100, 300]);
                }
            } else {
                resultBox.style.display = 'block';
                resultBox.innerText = "⚠️ 辨識不足";
                resultBox.className = "result-area fail";
                resultBox.style.background = "#555";
            }
        });
    </script>
</body>
</html>
