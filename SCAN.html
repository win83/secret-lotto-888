<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR 型號自動對比</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .ui-layer { position: absolute; bottom: 20px; width: 100%; text-align: center; pointer-events: none; }
        #msg { background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 1.2rem; }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="ui-layer"><span id="msg">🔍 正在尋找型號...</span></div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const msg = document.getElementById('msg');

    let isProcessing = false;

    // 啟動相機
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => { video.srcObject = stream; });

    // 初始化 Tesseract
    async function init() {
        const worker = await Tesseract.createWorker('eng');
        
        async function scan() {
            if (isProcessing) return;
            isProcessing = true;

            // 調整畫布大小匹配視頻
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            // 進行偵測（獲取文字位置數據）
            const result = await worker.recognize(canvas);
            const lines = result.data.lines;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 清除舊框
            
            let detectedModels = [];

            lines.forEach(line => {
                // 過濾出符合電器型號特徵的文字 (英數混合 + 橫線)
                const text = line.text.trim().replace(/[^A-Z0-9-]/g, '');
                if (text.length > 5) {
                    const b = line.bbox; // 獲取框線座標
                    
                    // 畫出偵測框
                    ctx.strokeStyle = "#00d1ff";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
                    
                    detectedModels.push({ text, bbox: b });
                }
            });

            // 如果偵測到至少兩個模型字串
            if (detectedModels.length >= 2) {
                const m1 = detectedModels[0];
                const m2 = detectedModels[1];

                if (m1.text === m2.text) {
                    msg.innerText = `✅ 吻合: ${m1.text}`;
                    ctx.strokeStyle = "#28a745"; // 綠色連線
                    if (navigator.vibrate) navigator.vibrate(200);
                } else {
                    msg.innerText = `❌ 錯誤! ${m1.text} ≠ ${m2.text}`;
                    ctx.strokeStyle = "#dc3545"; // 紅色連線
                    if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
                }
                
                // 在兩個框之間畫連線
                ctx.beginPath();
                ctx.moveTo(m1.bbox.x0, m1.bbox.y0);
                ctx.lineTo(m2.bbox.x0, m2.bbox.y0);
                ctx.stroke();
            }

            isProcessing = false;
            requestAnimationFrame(scan);
        }
        scan();
    }

    video.onloadedmetadata = init;
</script>
</body>
</html>
