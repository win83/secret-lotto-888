<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧出貨清點儀</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 15px; }
        .card { background: #1e1e1e; border-radius: 20px; padding: 20px; border: 2px solid #333; }
        .btn-main { background: #fbff00; color: #000; border: none; padding: 20px; border-radius: 50px; font-size: 1.4rem; font-weight: bold; width: 100%; cursor: pointer; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 12px; display: none; text-align: left; }
        .pass { background: #28a745; }
        .error { background: #dc3545; }
        .info-item { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 10px 0; }
        .sn-list { font-size: 0.8rem; color: #aaa; background: #000; padding: 10px; border-radius: 5px; margin-top: 5px; }
        #loading { display: none; margin: 20px 0; color: #fbff00; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎯 智慧清點比對</h2>
    <p>拍攝紅框區域：包含<b style="color:#fbff00">出貨品名</b>與<b style="color:#fbff00">所有貼紙</b></p>
    
    <input type="file" accept="image/*" capture="environment" id="file-input" style="display:none">
    <button class="btn-main" onclick="document.getElementById('file-input').click()">📸 拍照清點</button>

    <div id="loading">🚀 AI 正在分析數量與機碼...</div>

    <div id="result" class="result-box">
        <h3 id="res-title"></h3>
        <div class="info-item">📋 應出品名：<span id="target-name">--</span></div>
        <div class="info-item">🔢 偵測數量：<span id="detected-count">0</span> 張貼紙</div>
        <div class="info-item">🚫 重複檢查：<span id="duplicate-status">--</span></div>
        <div class="sn-list" id="sn-details"></div>
    </div>
</div>

<script>
    let worker;
    async function init() {
        worker = await Tesseract.createWorker('eng');
    }
    init();

    document.getElementById('file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const loading = document.getElementById('loading');
        const resultBox = document.getElementById('result');
        loading.style.display = 'block';
        resultBox.style.display = 'none';

        const result = await worker.recognize(file);
        const lines = result.data.lines;

        let allModels = []; // 存所有型號
        let allSNs = [];    // 存所有序號/機碼

        lines.forEach(line => {
            const text = line.text.trim().toUpperCase();
            // 辨識規則：型號通常包含大寫字母、數字及橫線
            const match = text.match(/[A-Z0-9-]{7,}/g);
            if (match) {
                match.forEach(m => {
                    // 如果這行包含特定的 S/N 或機碼特徵 (假設是比較長的或特定格式)
                    if (m.length > 10) allSNs.push(m);
                    else allModels.push(m);
                });
            }
        });

        // 邏輯分析
        const uniqueSNs = [...new Set(allSNs)]; // 去重後的序號
        const isDuplicate = allSNs.length !== uniqueSNs.length;
        const targetModel = allModels[0] || "未知"; // 假設第一筆抓到的是出貨單品名

        // 顯示結果
        loading.style.display = 'none';
        resultBox.style.display = 'block';
        
        document.getElementById('target-name').innerText = targetModel;
        document.getElementById('detected-count').innerText = allSNs.length;
        
        const resTitle = document.getElementById('res-msg');
        if (isDuplicate) {
            resultBox.className = "result-box error";
            document.getElementById('res-title').innerText = "❌ 發現重複機碼！";
            document.getElementById('duplicate-status').innerText = "有重複，請重新核對";
            if(navigator.vibrate) navigator.vibrate([500, 200, 500]);
        } else if (allSNs.length === 0) {
            resultBox.className = "result-box error";
            document.getElementById('res-title').innerText = "⚠️ 未能偵測到貼紙";
        } else {
            resultBox.className = "result-box pass";
            document.getElementById('res-title').innerText = "✅ 核對完成";
            document.getElementById('duplicate-status').innerText = "無重複";
            if(navigator.vibrate) navigator.vibrate(200);
        }

        document.getElementById('sn-details').innerText = "偵測到的機碼清單：\n" + uniqueSNs.join("\n");
    });
</script>
</body>
</html>
