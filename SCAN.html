<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>純文字機碼比對系統</title>
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #000; color: white; overflow: hidden; }
        .container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* 掃描準星框 */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .scan-region {
            width: 80%; height: 100px; border: 2px solid #00ff00;
            box-shadow: 0 0 0 5000px rgba(0, 0, 0, 0.5); border-radius: 8px;
        }
        
        .ui-panel {
            position: absolute; bottom: 30px; width: 100%; text-align: center;
            pointer-events: auto;
        }
        button {
            padding: 15px 40px; font-size: 18px; border-radius: 30px;
            border: none; background: #00ff00; color: black; font-weight: bold;
        }
        #result-status {
            position: absolute; top: 50px; width: 100%; text-align: center;
            font-size: 1.2em; padding: 10px;
        }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <video id="video" autoplay playsinline></video>
    
    <div class="overlay">
        <div class="scan-region"></div>
        <p>請將型號或機碼文字放入框內</p>
    </div>

    <div id="result-status">準備就緒</div>

    <div class="ui-panel">
        <button id="snap">立即比對文字</button>
        <p id="debug-text" style="font-size: 12px; color: #aaa; margin-top: 10px;"></p>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('result-status');
    const debug = document.getElementById('debug-text');

    // 啟動相機
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => { video.srcObject = stream; });

    document.getElementById('snap').addEventListener('click', async () => {
        status.innerText = "正在辨識文字...";
        status.style.color = "yellow";

        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 只擷取畫面中央（準星範圍）的圖片，提高辨識率與速度
        ctx.drawImage(video, 0, 0);
        
        Tesseract.recognize(canvas.toDataURL(), 'eng', {
            logger: m => console.log(m)
        }).then(({ data: { text } }) => {
            const cleanText = text.replace(/[^A-Z0-9-]/g, '').trim();
            debug.innerText = "偵測到內容: " + cleanText;

            // 比對邏輯：檢查同一個關鍵字（如 NA-V170NMS）是否在畫面中出現多次
            // 或是與您預設的資料比對
            checkMatch(cleanText);
        });
    });

    function checkMatch(text) {
        // 這裡放您要比對的邏輯
        // 範例：若偵測到 AH1K (機碼開頭)
        if (text.includes("AH1K") || text.includes("NAV170")) {
            status.innerText = "✅ 辨識成功！";
            status.style.color = "#00ff00";
        } else {
            status.innerText = "❌ 未偵測到目標文字";
            status.style.color = "#ff4444";
        }
    }
</script>
</body>
</html>
