<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 電器型號自動核對</title>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; overflow: hidden; text-align: center; }
        #video { width: 100%; height: auto; background: #222; }
        .focus-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                      width: 80%; height: 200px; border: 2px solid rgba(0, 209, 255, 0.5); border-radius: 10px; }
        .result-panel { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); padding: 20px; box-sizing: border-box; }
        .status { font-size: 2rem; font-weight: bold; margin-bottom: 10px; }
        .match { color: #28a745; }
        .mismatch { color: #dc3545; }
        .debug { font-size: 0.8rem; color: #aaa; }
        #loading { position: fixed; top: 0; width: 100%; background: #1a73e8; padding: 5px; z-index: 100; }
    </style>
</head>
<body>

<div id="loading">AI 引擎加載中...</div>
<video id="video" autoplay playsinline></video>
<div class="focus-area"></div>

<div class="result-panel">
    <div id="status" class="status">請對準單據型號</div>
    <div id="detail" class="debug">等待辨識...</div>
    <button onclick="location.reload()" style="margin-top:10px;">重新掃描</button>
</div>

<script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const detail = document.getElementById('detail');
    const loading = document.getElementById('loading');

    let worker;

    // 啟動相機
    async function setupCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment", focusMode: "continuous" } 
        });
        video.srcObject = stream;
    }

    // 初始化 AI 辨識
    async function initAI() {
        worker = Tesseract.createWorker();
        await worker.load();
        await worker.loadLanguage('eng');
        await worker.initialize('eng');
        loading.style.display = 'none';
        recognizeLoop();
    }

    async function recognizeLoop() {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // 進行文字辨識
        const { data: { text } } = await worker.recognize(canvas);
        
        // 尋找型號邏輯：找出所有包含英數與橫線的字串
        const models = text.match(/[A-Z0-9-]{5,}/g) || [];
        
        if (models.length >= 2) {
            // 取出前兩個最像型號的字串進行比對
            const modelA = models[0];
            const modelB = models[1];
            detail.innerText = `比對中: ${modelA} vs ${modelB}`;

            if (modelA === modelB) {
                status.innerText = "✅ 型號吻合";
                status.className = "status match";
                if(navigator.vibrate) navigator.vibrate(200);
            } else {
                status.innerText = "❌ 不吻合！";
                status.className = "status mismatch";
                if(navigator.vibrate) navigator.vibrate([300, 100, 300]);
            }
        } else if (models.length === 1) {
            detail.innerText = `只偵測到一個型號: ${models[0]}`;
        }

        // 稍微延遲後繼續下一次辨識，避免手機過熱
        setTimeout(recognizeLoop, 1500);
    }

    setupCamera().then(initAI);
</script>
</body>
</html>
